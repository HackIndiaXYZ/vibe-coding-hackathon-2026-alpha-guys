<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#5B9FFF"/>
      <stop offset="100%" stop-color="#8B65F5"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0C1228"/>
      <stop offset="100%" stop-color="#14203A"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Subtle border -->
  <rect width="64" height="64" rx="14" fill="none" stroke="rgba(91,159,255,0.3)" stroke-width="1"/>

  <!-- Graduation cap board (mortarboard top) -->
  <polygon
    points="32,12 56,24 32,36 8,24"
    fill="url(#grad)"
    opacity="0.95"
  />

  <!-- Cap shine highlight -->
  <polygon
    points="32,12 56,24 44,30 20,18"
    fill="rgba(255,255,255,0.12)"
  />

  <!-- Left side of cap body -->
  <path
    d="M14 27 L14 40 C14 40 20 46 32 46 C44 46 50 40 50 40 L50 27 L32 36 Z"
    fill="url(#grad)"
    opacity="0.85"
  />

  <!-- Tassel string -->
  <line x1="56" y1="24" x2="56" y2="36" stroke="url(#grad)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Tassel ball -->
  <circle cx="56" cy="38" r="3" fill="#F5B942"/>

  <!-- AI sparkle dots — top right corner -->
  <circle cx="48" cy="10" r="1.5" fill="#F5B942" opacity="0.9"/>
  <circle cx="54" cy="14" r="1"   fill="#5B9FFF" opacity="0.8"/>
  <circle cx="52" cy="7"  r="1"   fill="#8B65F5" opacity="0.7"/>
</svg>
